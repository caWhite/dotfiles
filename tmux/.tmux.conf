# Make active pane border much more visible
set-option -g pane-active-border-style fg=brightgreen,bg=default
set-option -g pane-border-style fg=colour238

# Highlight active pane with a status indicator
set-option -g pane-border-status top
set-option -g pane-border-format "#{?pane_active,#[fg=brightgreen bold] ACTIVE: #P ,#[fg=colour238] #P }"

set-option -g mode-keys vi
set mouse on

bind-key r source-file ~/.tmux.conf \; display "Config Reloaded!"
bind-key e set-window-option synchronize-panes

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
run-shell '~/.tmux/plugins/tmux-sensible/sensible.tmux'

